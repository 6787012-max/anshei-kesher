<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>כניסה — אנשי קשר</title>
  <meta name="robots" content="noindex">
  <link href="vendor/heebo.css" rel="stylesheet">
  <link rel="stylesheet" href="vendor/bootstrap-icons.css">
  <link rel="stylesheet" href="css/main.css">
  <style>body{background:var(--bg)}</style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-box">
      <div class="logo"><i class="bi bi-people-fill"></i></div>
      <h1>אנשי קשר — כניסה</h1>
      <label>אימייל<input id="email" type="email"></label>
      <label style="margin-top:12px">סיסמה<input id="password" type="password"></label>
      <button class="primary" style="width:100%" onclick="doLogin()">כניסה</button>
      <div id="err" class="msg err" style="display:none"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    if (AUTH.getSession() && Date.now() < AUTH.getSession().expires_at) {
      location.href = 'index.html';
    }
    async function doLogin() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('err');
      try {
        await AUTH.login(email, password);
        location.href = 'index.html';
      } catch (e) {
        errEl.textContent = e.message;
        errEl.style.display = 'block';
      }
    }
    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
  </script>
</body>
</html>
